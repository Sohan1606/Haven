const KEY='haven.workspace.v1';const defaults={name:'',capital:100,paperCash:10000,hidden:false,paused:false,risk:.25,minutes:15,voiceLang:'en-IN',speaker:true,history:[],positions:[],paperRealized:0};let storeError=false;let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...defaults};storeError=true}let page='home',marketTab='stocks',rec=null,voiceOpen=false,voiceMuted=false,voiceSpeaker=state.speaker,installPrompt=null,voiceText='',toastTimer;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('Storage unavailable. Changes may not survive closing this page.')}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return state.hidden?'••••':new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(n)}
function log(title,detail){state.history.unshift({title,detail,time:new Date().toISOString()});state.history=state.history.slice(0,150);persist()}
function toast(text){clearTimeout(toastTimer);document.getElementById('toastRoot').innerHTML=`<div class="toast" role="status">${esc(text)}</div>`;toastTimer=setTimeout(()=>document.getElementById('toastRoot').innerHTML='',4500)}
const navItems=[['home','home','Overview'],['markets','market','Markets'],['positions','wallet','Paper portfolio'],['activity','activity','Activity'],['settings','settings','Settings']];
function navigate(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){document.getElementById('desktopNav').innerHTML=navItems.map(([p,i,t])=>`<button data-page="${p}" class="${page===p?'active':''}">${svg(i)}${t}${p==='positions'&&state.positions.length?`<span class="count">${state.positions.length}</span>`:''}</button>`).join('');document.getElementById('mobileNav').innerHTML=navItems.map(([p,i,t])=>`<button data-page="${p}" class="${page===p?'active':''}">${svg(i)}${p==='positions'?'Portfolio':t}</button>`).join('');document.getElementById('breadcrumb').textContent=navItems.find(n=>n[0]===page)[2];document.getElementById('content').innerHTML=({home:home,markets:markets,positions:positions,activity:activity,settings:settings})[page]();iconize();bindPage()}
function heading(title,sub,extra=''){return `<div class="titleline"><div><h1>${title}</h1><p class="sub">${sub}</p></div>${extra||`<span class="date">${new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</span>`}</div>`}
function home(){return heading(`${state.name?esc(state.name)+', your':'Your'} next move. Simplified.`,'A clear head. A considered plan. Your own pace.')+`${state.paused?'<div class="banner">New practice entries are paused. Existing paper positions remain open. Resume in Settings.</div>':''}${storeError?'<div class="banner">Local storage could not be loaded. This session may not persist.</div>':''}<section class="hero"><div class="herotext"><div class="eyebrow">YOUR TIME. YOUR WORKSPACE.</div><h2>A little time.<br>A more informed next step.</h2><p>Tell your assistant when you’re available. Check readiness, understand your options, and move with intention.</p><button class="btn" id="available">${svg('clock',15)} I’m available now ${svg('arrow',15)}</button></div><div class="heroart"><div class="orbit"></div><div class="orbit two"></div><div class="orbit three"></div><div class="minicard"><div class="minihead">${svg('shield',15)} A measured approach</div><h3>No need to rush.</h3><p>A good decision can be to wait.</p><div class="minifoot">CLARITY FIRST. ACTION SECOND.</div></div><span class="leaf">${svg('leaf',22)}</span></div></section><section class="stats"><div class="card"><div class="statlabel">Your trading allocation<button class="iconbtn" id="hideBalance" aria-label="Toggle balance visibility">${svg('eye',14)}</button></div><div class="statvalue amount">${money(state.capital)}</div><div class="statfoot"><span class="tinybadge">MANUAL</span> Not a verified Groww balance</div></div><div class="card"><div class="statlabel">Practice cash ${svg('wallet',15)}</div><div class="statvalue amount">${money(state.paperCash)}</div><div class="statfoot"><span class="dot"></span> Virtual money · no real orders</div></div><div class="card"><div class="statlabel">Open practice positions ${svg('activity',15)}</div><div class="statvalue">${state.positions.length.toString().padStart(2,'0')}</div><div class="statfoot">${state.positions.length?'Simulated fills only':'A clean slate. No active exposure.'}</div></div></section><div class="grid"><div><section class="card"><div class="sectionhead"><h2>Your market window</h2><span class="tag amber">NOT CONNECTED</span></div><div class="tabs"><button class="${marketTab==='stocks'?'active':''}" data-market="stocks">Indian stocks</button><button class="${marketTab==='forex'?'active':''}" data-market="forex">Forex</button></div><div class="emptychart"><svg viewBox="0 0 600 150" preserveAspectRatio="none"><path d="M0 35H600M0 75H600M0 115H600" stroke="#dbe6d3" fill="none"/><path d="m0 120 40-20 40 9 40-30 40 5 40-20 40 12 40-32 40 10 40-24 40 12 40-22 40 10 40-35 40 7" stroke="#b5cf98" stroke-width="2" fill="none"/></svg><div class="chartoverlay">${svg('lock',16)} <strong>Real data. Before real decisions.</strong><p>Illustrative background · no live prices or signals</p></div></div>${(marketTab==='stocks'?[['N','NIFTY 50','Index watchlist'],['S','SENSEX','Index watchlist']]:[['€','EUR / USD','Analysis only · eligibility unverified'],['$','USD / INR','Analysis only · eligibility unverified']]).map(([t,n,s])=>`<div class="marketrow"><div class="marketname"><span class="ticker">${t}</span><div><strong>${n}</strong><small>${s}</small></div></div><span class="disconnected">Feed unavailable</span></div>`).join('')}<div style="margin-top:22px"><button class="textbtn" data-page="markets">Explore the practice workspace ${svg('arrow',13)}</button></div></section></div><div><section class="card"><div class="sectionhead"><h2>Ready, not rushed.</h2>${svg('shield',17)}</div><div class="statusline"><span>Market & news feeds</span><span>Not connected</span></div><div class="statusline"><span>Groww account</span><span>Not connected</span></div><div class="statusline"><span>Real-money execution</span><span>Disabled</span></div><div class="statusline"><span>Background monitoring</span><span>Not running</span></div><p class="help" style="margin-bottom:0">Nothing is being traded or watched on your behalf.</p></section><section class="card callcard"><div class="micround">${svg('mic',19)}</div><h2>Let’s talk it through.</h2><p>Your call-style voice workspace. Ask about your balance, practice, or next steps.</p><button class="btn" id="voiceStart">${svg('mic',15)} Talk to your assistant ${svg('arrow',15)}</button><div style="font-size:9px;color:#94af9c;margin-top:12px">Local command assistant · not a connected AI analyst</div></section></div></div><div class="bottomnote">${svg('shield',13)} Personal workspace · Records saved in this browser · No guaranteed returns · No live trading</div>`}
function markets(){return heading('Make space for a better decision.','Explore the workflow without putting money at risk.')+`<div class="banner">DEMONSTRATION ONLY — No market or news provider is connected. Sample instruments below are fictional; these are not recommendations.</div><div class="grid"><section class="card"><div class="sectionhead"><h2>A practice plan</h2><span class="tag">FICTIONAL SCENARIO</span></div><h2 style="font-size:24px;margin:10px 0">DEMO Equity</h2><p class="help">A fixed-price simulation to learn the order and exit workflow. Not an NSE/BSE instrument. No real broker order is created.</p><div class="statusline"><span>Simulated entry</span><strong>₹100.00</strong></div><div class="statusline"><span>Illustrative stop reference</span><strong>₹98.00</strong></div><div class="statusline"><span>Illustrative target reference</span><strong>₹104.00</strong></div><div class="statusline"><span>Practice charges</span><strong>₹1 per order</strong></div><div class="detailbox">These fixed values do not represent live conditions. No stop or target executes automatically. You choose a fixed simulated exit in the paper portfolio.</div><button class="btn full" id="practice" ${state.paused?'disabled':''}>${svg('plus',15)} Review a paper order</button></section><div><section class="card"><h2>Where live analysis stands</h2><p class="help">A real analysis requires licensed price data, current news, strategy validation, and account-aware checks. This build has none of those connections.</p><button class="btn secondary full" id="readiness">Check my readiness</button></section><section class="card" style="margin-top:20px"><h2>Forex, with boundaries.</h2><p class="help">Currency trading depends on residency, permitted purpose, eligible instruments, and broker access. An open global market is not permission to trade.</p><span class="tag amber">EXECUTION UNAVAILABLE</span></section></div></div>`}
function positions(){return heading('Your practice portfolio.','Virtual positions. Explicit actions. Nothing hidden.',`<button class="btn secondary small" data-page="markets">${svg('plus',14)} Practice order</button>`)+`<div class="banner">PAPER ONLY — Fixed simulated fills. No live price tracking, automatic stops, real orders, or background monitoring.</div><div class="stats"><div class="card"><div class="statlabel">Practice cash</div><div class="statvalue">${money(state.paperCash)}</div><div class="statfoot">Virtual balance</div></div><div class="card"><div class="statlabel">Realised practice P&L</div><div class="statvalue">${money(state.paperRealized)}</div><div class="statfoot">After simulated entry and exit fees</div></div><div class="card"><div class="statlabel">Open positions</div><div class="statvalue">${state.positions.length}</div><div class="statfoot">Cost basis only · no current valuation</div></div></div><section class="card">${state.positions.length?`<div class="sectionhead"><h2>Open paper positions</h2><span class="tag">SIMULATED</span></div><div class="tablewrap"><table><thead><tr><th>Instrument</th><th>Quantity</th><th>Entry</th><th>Entry fee</th><th>Action</th></tr></thead><tbody>${state.positions.map(p=>`<tr><td>DEMO Equity<br><small class="muted">Fictional instrument</small></td><td>${p.qty}</td><td>₹100.00</td><td>₹1.00</td><td><button class="btn secondary small" data-exit="${p.id}">Simulate exit</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${svg('wallet',34)}<h3>A clean slate.</h3><p>Try the paper workflow to see how entry, fees, and exits are recorded—without touching your ₹100.</p><button class="btn" data-page="markets">Explore a practice plan ${svg('arrow',14)}</button></div>`}</section>`}
function activity(){return heading('A record you can trust.','Your actions and checks, with their limitations made clear.',`<button class="btn secondary small" id="export">${svg('download',14)} Export records</button>`)+`<section class="card"><div class="sectionhead"><h2>Workspace activity</h2><span class="tag">LOCAL RECORDS</span></div>${state.history.length?state.history.map(h=>`<div class="journal"><div class="jdot"></div><div><strong>${esc(h.title)}</strong><p>${esc(h.detail)}</p><time>${new Date(h.time).toLocaleString('en-IN')}</time></div></div>`).join(''):`<div class="empty">${svg('activity',30)}<h3>Your story starts here.</h3><p>Readiness checks and simulated actions appear here. Voice audio and transcripts are not saved by this app.</p><button class="btn secondary" id="available">Check my readiness</button></div>`}</section><p class="help">This browser record is editable and deletable by anyone with device access. It is not a tamper-proof broker ledger.</p>`}
function settings(){return heading('Made for your rhythm.','Personal preferences. Clear boundaries.')+`<div class="settingsgrid"><section class="card"><h2>Your workspace</h2><form id="settingsForm"><label class="field"><span>What should we call you? (optional)</span><input name="name" value="${esc(state.name)}" maxlength="40" placeholder="Your name" autocomplete="given-name"></label><label class="field"><span>Trading allocation in rupees · manually entered</span><input name="capital" type="number" min="0" max="100000000" step="0.01" required value="${state.capital}"></label><p class="help">Not linked to Groww. Update this when your allocation changes. Changing it does not generate profit or move money.</p><label class="field"><span>Planning risk reference (%) · not an enforced broker limit</span><input name="risk" type="number" min="0.01" max="2" step="0.01" required value="${state.risk}"></label><label class="field"><span>Usually available for</span><select name="minutes">${[5,15,60].map(n=>`<option value="${n}" ${state.minutes===n?'selected':''}>${n} minutes</option>`).join('')}</select></label><label class="field"><span>Voice recognition language</span><select name="voiceLang"><option value="en-IN" ${state.voiceLang==='en-IN'?'selected':''}>English (India)</option><option value="hi-IN" ${state.voiceLang==='hi-IN'?'selected':''}>Hindi (India)</option></select></label><button class="btn full" type="submit">Save preferences</button></form></section><div><section class="card"><h2>Control & privacy</h2><div class="toggleline"><div><strong style="font-size:12px">Pause new paper entries</strong><p>Does not close existing paper positions.</p></div><input id="pauseToggle" type="checkbox" ${state.paused?'checked':''} aria-label="Pause new paper entries"></div><div class="toggleline"><div><strong style="font-size:12px">Hide balances</strong><p>Visual privacy, not encryption.</p></div><input id="hideToggle" type="checkbox" ${state.hidden?'checked':''} aria-label="Hide balances"></div><p class="help">No app login, biometric lock, or encrypted local database is implemented. Use a locked personal device. Anyone who can open this browser profile can access these records.</p><div class="footlinks"><button class="btn secondary small" id="export">Export backup</button><button class="btn danger small" id="deleteData">Delete local data</button></div></section><section class="card" style="margin-top:20px"><h2>Install & notifications</h2><p class="help">Installation depends on your browser and a stable HTTPS address. Background market alerts are not implemented.</p><div class="footlinks"><button class="btn secondary small" id="install">${svg('download',14)} Install / instructions</button><button class="btn secondary small" id="testNotification">Test notification</button></div></section><section class="card" style="margin-top:20px"><h2>Connections</h2><p class="help">Groww: not connected<br>Live prices / news: not connected<br>AI model: not connected<br>Background monitoring: not running</p><span class="tag amber">NO REAL-MONEY EXECUTION</span></section></div></div>`}
function bindPage(){document.querySelectorAll('[data-page]').forEach(e=>e.onclick=()=>navigate(e.dataset.page));document.querySelectorAll('[data-market]').forEach(e=>e.onclick=()=>{marketTab=e.dataset.market;render()});on('available',availability);on('readiness',availability);on('voiceStart',openVoice);on('hideBalance',()=>{state.hidden=!state.hidden;persist();render()});on('practice',paperOrder);on('export',exportData);on('install',install);on('testNotification',testNotification);on('deleteData',deleteData);document.querySelectorAll('[data-exit]').forEach(e=>e.onclick=()=>exitOrder(e.dataset.exit));on('pauseToggle',e=>{state.paused=e.target.checked;log(state.paused?'New paper entries paused':'Paper entries resumed','Existing paper positions were not changed.');render()},'change');on('hideToggle',e=>{state.hidden=e.target.checked;persist();render()},'change');on('settingsForm',e=>{e.preventDefault();const f=new FormData(e.target);const c=Number(f.get('capital')),r=Number(f.get('risk'));if(!Number.isFinite(c)||c<0||c>100000000||!Number.isFinite(r)||r<.01||r>2)return toast('Please check your allocation and risk values.');state.name=String(f.get('name')).trim();state.capital=c;state.risk=r;state.minutes=Number(f.get('minutes'));state.voiceLang=String(f.get('voiceLang'));log('Preferences updated','Manual allocation and planning preferences saved. No money moved.');render();toast('Preferences saved on this device.')},'submit')}
function on(id,fn,event='click'){const el=document.getElementById(id);if(el)el.addEventListener(event,fn)}
function modal(html,cls=''){document.getElementById('modalRoot').innerHTML=`<div class="modalback" id="modalBackdrop"><section class="modal ${cls}" role="dialog" aria-modal="true" aria-label="${cls==='voice'?'Voice session':'Workspace dialog'}">${html}</section></div>`;on('closeModal',closeModal);const focus=document.querySelector('.modal button,.modal input');if(focus)focus.focus()}
function mhead(t){return `<div class="modalhead"><h2>${t}</h2><button class="iconbtn" id="closeModal" aria-label="Close dialog">${svg('close')}</button></div>`}
function closeModal(){document.body.classList.remove('voice-session');if(voiceOpen)stopVoice();document.getElementById('modalRoot').innerHTML=''}
function availability(){let minutes=state.minutes;modal(mhead('A moment for your next move.')+`<p class="help">How much time do you have? We’ll check workspace readiness—not pretend to analyse a disconnected market.</p><div class="choices">${[5,15,60].map(n=>`<button class="choice ${minutes===n?'selected':''}" data-min="${n}">${n===60?'1 hour':n+' minutes'}</button>`).join('')}</div><button class="btn full" id="runCheck">Check my readiness ${svg('arrow',15)}</button><p class="help">No orders will be placed. No market or news feed is connected.</p>`);document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{minutes=Number(b.dataset.min);document.querySelectorAll('[data-min]').forEach(e=>e.classList.toggle('selected',e===b))});on('runCheck',()=>{state.minutes=minutes;persist();log('Readiness check completed',`${minutes} minutes available. No actionable analysis: market, news, and broker feeds are disconnected.`);showReadiness(minutes)})}
function showReadiness(minutes){modal(mhead('Your next step: keep it measured.')+`<span class="tag">READINESS CHECK · NOT MARKET ANALYSIS</span><div class="checkrow"><span>${svg('check',15)}</span> Availability recorded: ${minutes} minutes</div><div class="checkrow"><span>${svg('check',15)}</span> Manual allocation: ${money(state.capital)}</div><div class="checkrow"><span>${svg('info',15)}</span> Market, news & broker data: unavailable</div><div class="result"><div class="eyebrow">NO LIVE TRADE PLAN</div><h3>Keep your real money available.</h3><p>We cannot evaluate a suitable trade without verified data. Your planning risk reference is ${money(state.capital*state.risk/100)} (${state.risk}%). Small allocations may not support a sensible trade after costs.</p></div><button class="btn full" id="tryPractice">Explore the paper workflow ${svg('arrow',15)}</button><p class="help">You are not receiving live market analysis or a recommendation. Checked ${new Date().toLocaleTimeString('en-IN')}.</p>`);on('tryPractice',()=>{closeModal();navigate('markets')});render()}
function paperOrder(){if(state.paused)return toast('Paper entries are paused in Settings.');modal(mhead('Review a paper order')+`<span class="tag">FICTIONAL · VIRTUAL MONEY ONLY</span><p class="help">DEMO Equity at a fixed ₹100 per unit. This is a workflow demonstration, not a signal.</p><form id="paperForm"><label class="field"><span>Quantity (1–100)</span><input id="qty" type="number" min="1" max="100" step="1" value="1" required></label><div class="detailbox" id="orderTotal">Total debit: ₹101.00 · includes a simulated ₹1 entry fee.</div><label class="toggleline" style="justify-content:start"><input type="checkbox" required><span style="font-size:12px">I understand this uses virtual money and a fictional price.</span></label><button class="btn full" type="submit">Confirm simulated entry</button></form>`);on('qty',e=>{const q=Number(e.target.value);document.getElementById('orderTotal').textContent=`Total debit: ₹${(q*100+1).toFixed(2)} · includes a simulated ₹1 entry fee.`},'input');on('paperForm',e=>{e.preventDefault();const q=Number(document.getElementById('qty').value);if(!Number.isInteger(q)||q<1||q>100)return toast('Use a whole quantity from 1 to 100.');if(q*100+1>state.paperCash)return toast('Not enough virtual cash. Reduce the quantity.');if(state.paused)return toast('Entries are paused.');state.paperCash-=q*100+1;state.positions.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),qty:q,entry:100,fee:1,time:new Date().toISOString()});log('Paper entry simulated',`${q} DEMO Equity at fixed ₹100. Entry fee ₹1. No real order.`);closeModal();navigate('positions');toast('Simulated entry recorded. No real money used.')},'submit')}
function exitOrder(id){const p=state.positions.find(p=>p.id===id);if(!p)return;modal(mhead('Simulate an exit')+`<p class="help">Choose a fixed scenario for ${p.qty} fictional units. These are not live market prices. A simulated ₹1 exit fee applies.</p><div class="choices">${[98,100,104].map(v=>`<button class="choice" data-price="${v}">₹${v}<br><small class="muted">${v<100?'Loss':v===100?'Flat price':'Gain'}</small></button>`).join('')}</div><div id="exitDetail" class="help">Choose a scenario to review the net result.</div><button class="btn full" id="confirmExit" disabled style="margin-top:20px">Confirm simulated exit</button>`);let price=null;document.querySelectorAll('[data-price]').forEach(b=>b.onclick=()=>{price=Number(b.dataset.price);document.querySelectorAll('[data-price]').forEach(e=>e.classList.toggle('selected',e===b));const pnl=(price-100)*p.qty-2;document.getElementById('exitDetail').textContent=`Net realised P&L after ₹2 combined fees: ₹${pnl.toFixed(2)}. Cash returned: ₹${(price*p.qty-1).toFixed(2)}.`;document.getElementById('confirmExit').disabled=false});on('confirmExit',()=>{if(price===null)return;const current=state.positions.find(x=>x.id===id);if(!current)return;const pnl=(price-100)*p.qty-2;state.paperCash+=price*p.qty-1;state.paperRealized+=pnl;state.positions=state.positions.filter(x=>x.id!==id);log('Paper position closed',`${p.qty} DEMO Equity at fixed ₹${price}. Net realised P&L ₹${pnl.toFixed(2)} after entry/exit fees.`);closeModal();render();toast('Paper exit recorded. No real order was placed.')})}
function exportData(){const blob=new Blob([JSON.stringify({app:'Haven',exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='haven-private-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup downloaded. It contains unencrypted personal records.')}
function deleteData(){modal(mhead('Delete this device’s records?')+`<p class="help">This removes your preferences, paper positions, and activity from this browser. Export first if you need a copy. It does not affect Groww or previously exported files.</p><button class="btn danger full" id="confirmDelete">Delete local workspace data</button>`);on('confirmDelete',()=>{try{localStorage.removeItem(KEY)}catch{}state=JSON.parse(JSON.stringify(defaults));closeModal();render();toast('Local workspace reset.')})}
async function testNotification(){if(!('Notification'in window))return toast('This browser does not support web notifications.');try{const perm=await Notification.requestPermission();if(perm!=='granted')return toast('Notification permission not granted. Check browser settings.');if('serviceWorker'in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.showNotification('Haven · Test notification',{body:'Delivery test only. No live market monitoring is running.',tag:'haven-test'});else new Notification('Haven · Test only',{body:'No live monitoring is running.'})}else new Notification('Haven · Test only');toast('Test requested. Delivery is controlled by your browser and OS.')}catch{toast('Notification unavailable here. Try Chrome at a stable HTTPS address.')}}
async function install(){if(installPrompt){await installPrompt.prompt();installPrompt=null;return}modal(mhead('Your workspace, on your device.')+`<div class="guideStep"><span class="stepnum">1</span><p><strong>Android · Chrome</strong><br>Open the stable HTTPS app address. Use ⋮ → “Install app” or “Add to Home screen”, if offered.</p></div><div class="guideStep"><span class="stepnum">2</span><p><strong>Laptop · Chrome or Edge</strong><br>Use the install icon in the address bar or the browser menu’s app installation option.</p></div><div class="guideStep"><span class="stepnum">3</span><p><strong>No installation option?</strong><br>Use a bookmark. A preview address may be temporary or embedded; open it directly in your browser.</p></div><div class="detailbox">This is a web app, not a signed Android APK. Installation does not add broker access or background market monitoring. Local records belong to each browser/device separately.</div>`)}
function openVoice(){document.body.classList.add('voice-session');voiceOpen=true;voiceMuted=false;voiceText='';modal(`<div class="modalhead"><span>HAVEN · VOICE WORKSPACE</span><span>${svg('lock',14)} ON DEMAND</span></div><div class="orb" id="orb"></div><h2 id="voiceStatus">Let’s talk it through.</h2><p id="voiceHint">Tap the microphone to start. Your browser may use an external speech service.</p><div class="transcript" id="transcript" aria-live="polite">Try: “What is my balance?”, “I am available”, “Show my positions”, or “Help”. This is a limited command assistant, not a market AI.</div><div class="voicecontrols"><button class="roundbtn" id="micToggle" aria-label="Start or mute microphone">${svg('mic',20)}</button><button class="roundbtn hangup" id="hangup" aria-label="End voice session">${svg('phone',25)}</button><button class="roundbtn" id="speakerToggle" aria-label="Toggle spoken responses" style="opacity:${voiceSpeaker?1:.5}">${svg('speaker',20)}</button></div><p class="voicenote">No audio recording or transcript is saved by Haven.<br>Browser speech processing may occur outside your device.<br>Red hang-up stops capture and spoken output.</p>`,'voice');on('hangup',closeModal);on('micToggle',()=>{if(rec){stopRecognition();setVoiceStatus('Microphone off.','Tap the microphone to speak again.')}else startRecognition()});on('speakerToggle',()=>{voiceSpeaker=!voiceSpeaker;document.getElementById('speakerToggle').style.opacity=voiceSpeaker?1:.5;if(!voiceSpeaker&&window.speechSynthesis)window.speechSynthesis.cancel()})}
function setVoiceStatus(t,h){const s=document.getElementById('voiceStatus'),hint=document.getElementById('voiceHint');if(s)s.textContent=t;if(hint)hint.textContent=h}
function stopRecognition(){const r=rec;rec=null;if(r){r.onend=null;r.onresult=null;try{r.abort()}catch{}}document.getElementById('orb')?.classList.remove('listening')}
function stopVoice(){voiceOpen=false;stopRecognition();if(window.speechSynthesis)window.speechSynthesis.cancel()}
function startRecognition(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){setVoiceStatus('Voice isn’t supported here.','Use Chrome on Android or desktop. All main actions are also available as buttons.');return}if(window.speechSynthesis)window.speechSynthesis.cancel();try{rec=new R();const current=rec;current.lang=state.voiceLang;current.continuous=false;current.interimResults=true;current.onstart=()=>{if(!voiceOpen)return;setVoiceStatus('I’m listening.','Speak, then pause. Tap the microphone to stop capture.');document.getElementById('orb')?.classList.add('listening')};current.onresult=e=>{if(!voiceOpen||rec!==current)return;let text='';for(let i=0;i<e.results.length;i++)text+=e.results[i][0].transcript;document.getElementById('transcript').textContent='You: '+text;if(e.results[e.results.length-1].isFinal){voiceText=text;stopRecognition();respond(text)}};current.onerror=e=>{if(!voiceOpen||rec!==current)return;stopRecognition();setVoiceStatus('Microphone unavailable.',e.error==='not-allowed'?'Allow microphone access in browser settings, or use the on-screen controls.':'Speech service error: '+e.error+'. Please try again.')};current.onend=()=>{if(rec===current){rec=null;document.getElementById('orb')?.classList.remove('listening');if(voiceOpen)setVoiceStatus('Microphone off.','Tap the microphone to speak again.')}};current.start()}catch{stopRecognition();setVoiceStatus('Unable to start voice.','Try opening this address directly in Chrome over HTTPS.')}}
function respond(text){const t=text.toLowerCase();let answer;if(/balance|money|capital|पैस|बैलेंस/.test(t))answer=`Your manually entered allocation is ${state.hidden?'hidden':state.capital+' rupees'}. It is not verified with Groww. Your practice cash is ${state.hidden?'hidden':state.paperCash.toFixed(2)+' virtual rupees'}.`;else if(/available|free|ready|उपलब्ध|खाली/.test(t))answer='No market, news, or Groww feed is connected, so I cannot give a live trade plan. Keep your real money available. Use the I am available now button for a readiness check.';else if(/position|portfolio|holding|पोर्टफोलियो/.test(t))answer=`You have ${state.positions.length} paper positions recorded here. I cannot see your real Groww holdings. Open Paper portfolio after this call to review simulations.`;else if(/buy|sell|profit|stock|खरीद|बेच|मुनाफ/.test(t))answer='I cannot make a verified live recommendation or place a real order. No live market or broker service is connected. You can explore the fictional paper plan in Markets. No trading system can guarantee profit.';else if(/private|privacy|record|गोपनीय/.test(t))answer='This app saves preferences and paper records in this browser. It does not save voice recordings or transcripts. Browser speech recognition may use an external service. There is no app authentication or encrypted database in this build.';else if(/pause|busy|व्यस्त/.test(t)){state.paused=true;log('Paper entries paused by voice','No existing paper positions were closed.');render();answer='New paper entries are paused. Existing paper positions are unchanged. I do not manage any real Groww positions.'}else answer='I am a limited command assistant, not a connected AI analyst. Ask about balance, positions, availability, privacy, or pausing practice entries. Use the workspace buttons for other actions.';const tr=document.getElementById('transcript');if(tr)tr.textContent=`You: ${text}\n\nHaven: ${answer}`;setVoiceStatus('Here’s the clear picture.','Tap the microphone for another question.');if(voiceSpeaker&&window.speechSynthesis){const utter=new SpeechSynthesisUtterance(answer);utter.lang='en-IN';utter.rate=.95;window.speechSynthesis.speak(utter)}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});document.getElementById('alertsBtn').onclick=()=>navigate('activity');document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&document.querySelector('.modal')){const items=[...document.querySelectorAll('.modal button:not(:disabled),.modal input,.modal select')];if(!items.length)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&voiceOpen){stopRecognition();if(window.speechSynthesis)window.speechSynthesis.cancel();setVoiceStatus('Microphone off.','Capture stopped when the app went into the background.')}});window.addEventListener('pagehide',stopVoice);render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
